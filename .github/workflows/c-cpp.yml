name: C/C++ CI

on:
  push:
    branches: [ "origin" ]
  pull_request:
    branches: [ "origin" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./test/ch_test
        
    steps:
    - uses: actions/checkout@v4
    - uses: Bacondish2023/setup-googletest@v1
      with:
        tag: v1.14.0
    - name: Setup LCOV
      uses: hrishikesh-kadam/setup-lcov@v1 # Use the setup action
    - name: setup
      run: ./setup.sh
    - name: run
      run: make run
